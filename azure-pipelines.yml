trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: Vercel-Credentials
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

steps:
  - checkout: self

  - task: vercel-deployment-task@3
    name: Deploy
    inputs:
      vercelToken: '$(VERCEL_TOKEN)'
      production: $(isMain)
    env:
      VERCEL_PROJECT_ID: 'prj_ZMoV1OBoo7qyeIteCt6OU4b3s3LH'
      VERCEL_ORG_ID: 'team_AYRVerFJXeoaUBDxSl3uudVn'
    condition: or(eq(variables.isMain, true), eq(variables['Build.Reason'], 'PullRequest'))

  - task: vercel-azdo-pr-comment-task@3
    inputs:
      azureToken: $(AZURE_PAT)
      deploymentTaskMessage: $(Deploy.deploymentTaskMessage)
    condition: eq(variables['Build.Reason'], 'PullRequest')
